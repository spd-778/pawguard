services:
  pawguard-web:
    image: ghcr.io/spd-778/pawguard:latest
    container_name: pawguard-web
    restart: unless-stopped

    ports:
      - "8080:80"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
