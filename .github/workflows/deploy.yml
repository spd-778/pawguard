name: PawGuard CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

env:
  PROJECT_ID: pawguard-507001
  VM_NAME: pawguard-app
  VM_ZONE: northamerica-northeast1-a
  IMAGE_NAME: ghcr.io/spd-778/pawguard

jobs:

  build-and-push:
    name: Build and Publish
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Export image reference
        id: image
        run: |
          echo "image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to GCP
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy immutable image
        run: |
          gcloud compute ssh "$VM_NAME" \
            --project="$PROJECT_ID" \
            --zone="$VM_ZONE" \
            --tunnel-through-iap \
            --command="
              cd ~/pawguard &&
              export PAWGUARD_IMAGE='${IMAGE_NAME}:${GITHUB_SHA}' &&
              sed -i \"s|image: ghcr.io/spd-778/pawguard:.*|image: \${PAWGUARD_IMAGE}|\" docker-compose.yml &&
              docker compose pull pawguard-web &&
              docker compose up -d pawguard-web &&
              sleep 20 &&
              docker compose ps
            "

      - name: Verify deployment
        run: |
          gcloud compute ssh "$VM_NAME" \
            --project="$PROJECT_ID" \
            --zone="$VM_ZONE" \
            --tunnel-through-iap \
            --command="
              curl -fsS http://localhost:8080 > /dev/null &&
              docker inspect pawguard-web --format='Health={{.State.Health.Status}} Image={{.Config.Image}}' &&
              echo 'Deployment successful'
            "
