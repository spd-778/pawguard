name: PawGuard CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

env:
  PROJECT_ID: pawguard-507001
  VM_NAME: pawguard-app
  VM_ZONE: northamerica-northeast1-a
  IMAGE: ghcr.io/spd-778/pawguard:latest

jobs:

  build-and-push:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/spd-778/pawguard:latest
            ghcr.io/spd-778/pawguard:${{ github.sha }}

  deploy:
    name: Deploy to GCP
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to GCP VM
        run: |
          gcloud compute ssh "$VM_NAME" \
            --project="$PROJECT_ID" \
            --zone="$VM_ZONE" \
            --tunnel-through-iap \
            --command="
              cd ~/pawguard &&
              git fetch origin main &&
              git reset --hard origin/main &&
              docker compose pull pawguard-web &&
              docker compose up -d pawguard-web &&
              sleep 20 &&
              docker compose ps
            "

      - name: Verify PawGuard
        run: |
          gcloud compute ssh "$VM_NAME" \
            --project="$PROJECT_ID" \
            --zone="$VM_ZONE" \
            --tunnel-through-iap \
            --command="
              curl -fsS http://localhost:8080 > /dev/null &&
              echo 'PawGuard deployment successful'
            "
